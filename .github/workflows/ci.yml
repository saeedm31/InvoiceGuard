name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Evals (scripted model; fails on any unsafe payment)
        run: python -m invoiceguard eval
      - name: Evals with Claude (only when the secret is set)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: python -m invoiceguard eval --live --out eval_report_ci.json
