<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="t d" fill="#13262A"><title id="t">How InvoiceGuard works</title><desc id="d">A supplier invoice is read, extracted by Claude, investigated with read-only ERP tools, checked by code, explained by Claude and acted on by code. A person approves large payments with a signed token.</desc><defs><marker id="head" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#5E6B6E"/></marker></defs><style>text{font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif}.h{font-family:'Space Grotesk', Inter, 'Segoe UI', Helvetica, Arial, sans-serif}</style><rect width="1600" height="880" fill="#F6F5F1"/><text x="64" y="98" font-size="40" class="h" font-weight="700">How InvoiceGuard works</text>
<text x="64" y="148" font-size="18" fill="#3F4D50">The AI reads and investigates, code decides, a person approves big payments. A hidden instruction in a PDF,</text>
<text x="64" y="176" font-size="18" fill="#3F4D50">a changed IBAN or a model mistake can never pay a supplier.</text>
<rect x="1024.5" y="64.5" width="95" height="35" rx="18" fill="#E3EAEC" stroke="#9FB3B8"/>
<text x="1072" y="87" font-size="14" font-weight="600" fill="#23414A" text-anchor="middle">Data</text>
<rect x="1132.5" y="64.5" width="147" height="35" rx="18" fill="#D6EEEB" stroke="#5FA39E"/>
<text x="1206" y="87" font-size="14" font-weight="600" fill="#0B4F52" text-anchor="middle">Code decides</text>
<rect x="1292.5" y="64.5" width="127" height="35" rx="18" fill="#FCEBD0" stroke="#DDA04A"/>
<text x="1356" y="87" font-size="14" font-weight="600" fill="#6E4300" text-anchor="middle">AI (Claude)</text>
<rect x="1432.5" y="64.5" width="103" height="35" rx="18" fill="#ECE6F7" stroke="#9C88D2"/>
<text x="1484" y="87" font-size="14" font-weight="600" fill="#45307A" text-anchor="middle">People</text>
<line x1="288" y1="360" x2="372" y2="360" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="600" y1="360" x2="684" y2="360" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="912" y1="360" x2="996" y2="360" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="1224" y1="360" x2="1308" y2="360" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="763" y1="456" x2="763" y2="548" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="837" y1="552" x2="837" y2="460" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="1424" y1="456" x2="1424" y2="548" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="1312" y1="613" x2="1228" y2="613" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="1224" y1="675" x2="1308" y2="675" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="1424" y1="736" x2="1424" y2="784" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round"/>
<line x1="1424" y1="784" x2="800" y2="784" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round"/>
<line x1="800" y1="784" x2="800" y2="740" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<text x="64" y="244" font-size="12" font-weight="600" fill="#4E5B5E" letter-spacing="1.4">1 · READ</text>
<text x="376" y="244" font-size="12" font-weight="600" fill="#4E5B5E" letter-spacing="1.4">2 · EXTRACT (AI)</text>
<text x="688" y="244" font-size="12" font-weight="600" fill="#4E5B5E" letter-spacing="1.4">3 · INVESTIGATE (AI)</text>
<text x="1000" y="244" font-size="12" font-weight="600" fill="#4E5B5E" letter-spacing="1.4">4 · CHECK (CODE)</text>
<text x="1312" y="244" font-size="12" font-weight="600" fill="#4E5B5E" letter-spacing="1.4">5 · EXPLAIN (AI)</text>
<rect x="64.5" y="264.5" width="223" height="191" rx="14" fill="#E3EAEC" stroke="#9FB3B8"/>
<g transform="translate(164,289)" fill="none" stroke="#23414A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></g>
<text x="176" y="337" font-size="18" class="h" font-weight="700" fill="#23414A" text-anchor="middle">Invoice inbox</text>
<text x="176" y="359" font-size="15" text-anchor="middle">PDF text from the</text>
<text x="176" y="381" font-size="15" text-anchor="middle">documents MCP.</text>
<text x="176" y="403" font-size="15" text-anchor="middle">A scanner flags</text>
<text x="176" y="425" font-size="15" text-anchor="middle">hidden instructions</text>
<rect x="376.5" y="264.5" width="223" height="191" rx="14" fill="#FCEBD0" stroke="#DDA04A"/>
<g transform="translate(476,289)" fill="none" stroke="#6E4300" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></g>
<text x="488" y="337" font-size="18" class="h" font-weight="700" fill="#6E4300" text-anchor="middle">Extract</text>
<text x="488" y="359" font-size="15" text-anchor="middle">Claude fills a</text>
<text x="488" y="381" font-size="15" text-anchor="middle">fixed schema.</text>
<text x="488" y="403" font-size="15" text-anchor="middle">No tools, so a</text>
<text x="488" y="425" font-size="15" text-anchor="middle">trick cannot act</text>
<rect x="688.5" y="264.5" width="223" height="191" rx="14" fill="#FCEBD0" stroke="#DDA04A"/>
<g transform="translate(788,289)" fill="none" stroke="#6E4300" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></g>
<text x="800" y="337" font-size="18" class="h" font-weight="700" fill="#6E4300" text-anchor="middle">Investigate</text>
<text x="800" y="359" font-size="15" text-anchor="middle">Sees the fields only,</text>
<text x="800" y="381" font-size="15" text-anchor="middle">never the PDF.</text>
<text x="800" y="403" font-size="15" text-anchor="middle">Uses 6 read-only</text>
<text x="800" y="425" font-size="15" text-anchor="middle">ERP tools</text>
<rect x="1000.5" y="264.5" width="223" height="191" rx="14" fill="#D6EEEB" stroke="#5FA39E"/>
<g transform="translate(1100,289)" fill="none" stroke="#0B4F52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></g>
<text x="1112" y="337" font-size="18" class="h" font-weight="700" fill="#0B4F52" text-anchor="middle">Check</text>
<text x="1112" y="359" font-size="15" text-anchor="middle">Code re-reads ERP</text>
<text x="1112" y="381" font-size="15" text-anchor="middle">facts: 3-way match</text>
<text x="1112" y="403" font-size="15" text-anchor="middle">+ payment policy.</text>
<text x="1112" y="425" font-size="15" text-anchor="middle">AI can&#x27;t loosen it.</text>
<rect x="1312.5" y="264.5" width="223" height="191" rx="14" fill="#FCEBD0" stroke="#DDA04A"/>
<g transform="translate(1412,289)" fill="none" stroke="#6E4300" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></g>
<text x="1424" y="337" font-size="18" class="h" font-weight="700" fill="#6E4300" text-anchor="middle">Explain</text>
<text x="1424" y="359" font-size="15" text-anchor="middle">Claude writes the</text>
<text x="1424" y="381" font-size="15" text-anchor="middle">clerk&#x27;s note and a</text>
<text x="1424" y="403" font-size="15" text-anchor="middle">supplier email.</text>
<text x="1424" y="425" font-size="15" text-anchor="middle">Numbers verified.</text>
<rect x="64.5" y="552.5" width="535" height="183" rx="14" fill="#FFFFFF" stroke="#C9C4B6"/>
<g transform="translate(92,573)" fill="none" stroke="#13262A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></g>
<text x="92" y="621" font-size="18" class="h" font-weight="700">Built-in control</text>
<text x="92" y="643" font-size="15">The AI has 6 read-only tools. Only code writes or pays.</text>
<text x="92" y="665" font-size="15">Payment needs a signed, single-use token for one amount.</text>
<text x="92" y="687" font-size="15">Full IBANs never reach the model or the logs.</text>
<text x="92" y="709" font-size="15">Every step goes to a tamper-evident audit log.</text>
<rect x="688.5" y="552.5" width="223" height="183" rx="14" fill="#E3EAEC" stroke="#9FB3B8"/>
<g transform="translate(788,573)" fill="none" stroke="#23414A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
<text x="800" y="621" font-size="18" class="h" font-weight="700" fill="#23414A" text-anchor="middle">ERP (MCP)</text>
<text x="800" y="643" font-size="15" text-anchor="middle">Vendors, orders,</text>
<text x="800" y="665" font-size="15" text-anchor="middle">goods receipts,</text>
<text x="800" y="687" font-size="15" text-anchor="middle">past invoices.</text>
<text x="800" y="709" font-size="15" text-anchor="middle">Writes: code only</text>
<rect x="1000.5" y="552.5" width="223" height="183" rx="14" fill="#ECE6F7" stroke="#9C88D2"/>
<g transform="translate(1100,573)" fill="none" stroke="#45307A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M16 11l2 2 4-4"/></g>
<text x="1112" y="621" font-size="18" class="h" font-weight="700" fill="#45307A" text-anchor="middle">Person approves</text>
<text x="1112" y="643" font-size="15" text-anchor="middle">Over EUR 10,000:</text>
<text x="1112" y="665" font-size="15" text-anchor="middle">manager or CFO</text>
<text x="1112" y="687" font-size="15" text-anchor="middle">approves, then code</text>
<text x="1112" y="709" font-size="15" text-anchor="middle">mints the token</text>
<rect x="1312.5" y="552.5" width="223" height="183" rx="14" fill="#D6EEEB" stroke="#5FA39E"/>
<g transform="translate(1412,573)" fill="none" stroke="#0B4F52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></g>
<text x="1424" y="621" font-size="18" class="h" font-weight="700" fill="#0B4F52" text-anchor="middle">Act</text>
<text x="1424" y="643" font-size="15" text-anchor="middle">Code books, pays,</text>
<text x="1424" y="665" font-size="15" text-anchor="middle">holds or rejects.</text>
<text x="1424" y="687" font-size="15" text-anchor="middle">Notify MCP tells</text>
<text x="1424" y="709" font-size="15" text-anchor="middle">the right people</text>
<text x="332" y="344" font-size="13" fill="#4E5B5E" text-anchor="middle">PDF text</text>
<text x="644" y="344" font-size="13" fill="#4E5B5E" text-anchor="middle">fields</text>
<text x="956" y="344" font-size="13" fill="#4E5B5E" text-anchor="middle">proposal</text>
<text x="1268" y="344" font-size="13" fill="#4E5B5E" text-anchor="middle">decision</text>
<text x="749" y="508" font-size="13" fill="#4E5B5E" text-anchor="end">asks</text>
<text x="849" y="508" font-size="13" fill="#4E5B5E">facts</text>
<text x="1436" y="508" font-size="13" fill="#4E5B5E">note</text>
<text x="1268" y="597" font-size="13" fill="#4E5B5E" text-anchor="middle">&gt; EUR 10k</text>
<text x="1268" y="699" font-size="13" fill="#4E5B5E" text-anchor="middle">token</text>
<text x="1112" y="808" font-size="13" fill="#4E5B5E" text-anchor="middle">book, pay, hold or reject: code only</text></svg>
